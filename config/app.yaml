app_name_key: app_title          # UI strings live in locales/
max_input_chars: 800
history_turns: 6
history_chars: 2400
rate_limit:
  per_ip_per_minute: 12
  per_session_per_minute: 8
cors_allow_origins: []            # same-origin SPA; add origins here if embedding elsewhere
admin_token_env: ADMIN_TOKEN
runtime_dir: data/runtime         # leads and feedback; not baked into the image
retention_days:
  leads: 90
  feedback: 180
suggestions:
  count: 6
  per_brand: 3
  # Routine filings and navigation pages make poor starter questions.
  skip_title_words: ["agm", "notice", "publication", "about us", "contact", "board change", "fact sheet", "key figures",
                     "key facts", "portfolio", "investor relations", "history", "overview", "references"]
numeric_check:
  min_digits: 3                   # numbers shorter than this (bed counts, list markers) are not checked
crm:
  webhook_env: CRM_WEBHOOK_URL
  timeout_seconds: 8
# Shown in the UI footer and the "waking up" screen so visitors know why a first load can be slow.
hosting:
  provider: Render
  plan: free
  sleeps_after_minutes: 15
  cold_start_seconds: 60
  keep_warm: GitHub Actions ping every 10 minutes (.github/workflows/keep-warm.yml)
