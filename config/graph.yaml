# Knowledge graph (GraphRAG). Entities are matched in every indexed chunk by alias; two entities named in
# the same sentence get an edge whose label comes from their type pair, and every edge keeps the chunks
# that evidence it. Relations are therefore only ever as strong as the source text: the graph adds
# structure and reach (multi-hop, aggregation, cross-lingual entry points), never new facts.
enabled: true
max_evidence_per_edge: 6
min_edge_weight: 1
# Relations that only link an entity to the nearest entity of the other type in the sentence.
nearest_only: ["located in", "branded with"]
# Query-time expansion
max_seed_entities: 4
max_neighbours: 10
max_graph_chunks: 30
max_facts_in_prompt: 10
# A question containing one of these words wants neighbours of that type first ("projects in Oman").
type_cues:
  project: ["project", "projects", "development", "developments", "tower", "towers", "residences", "villas",
            "مشروع", "مشاريع", "مشروعات", "برج", "أبراج", "فلل"]
  partner: ["partner", "partners", "partnership", "brand", "brands", "branded", "collaboration",
            "شريك", "شركاء", "شراكة", "علامة", "علامات"]
  place: ["where", "country", "countries", "city", "cities", "market", "markets", "أين", "دولة", "دول", "مدينة", "مدن", "أسواق"]
  person: ["ceo", "chairman", "chief executive", "management", "board", "الرئيس التنفيذي", "رئيس مجلس", "الإدارة"]
# Edge label by (type, type), order-insensitive. Pairs not listed here produce no edge.
relations:
  company|project: develops
  project|place: located in
  partner|project: branded with
  company|partner: partners with
  company|place: active in
  company|exchange: listed on
  company|company: related to
  person|company: leads
  project|project: mentioned with
labels:
  en: {company: Company, project: Project, partner: Partner brand, place: Place, exchange: Exchange, person: Person}
  ar: {company: شركة, project: مشروع, partner: علامة شريكة, place: موقع, exchange: سوق مالية, person: شخص}
