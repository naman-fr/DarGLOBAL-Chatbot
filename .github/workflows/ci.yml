name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ingest.lock
      - run: pip install -r requirements-ingest.lock pytest ruff
      - name: lint
        run: ruff check src tests evals scripts && ruff format --check src tests evals scripts
      - name: unit and API tests
        run: pytest -q
        env: {PYTHONPATH: src}
      - name: prepare the int8 embedding model (same recipe as the image)
        run: python -c "from concierge.kb.embed import prepare_model; prepare_model()"
        env: {PYTHONPATH: src}
      - name: retrieval, router, refusal and guardrail gates (uses the committed KB snapshot)
        run: python evals/run_eval.py
        env: {PYTHONPATH: src}

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - name: image name (registry paths must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: ${{ github.ref != 'refs/heads/main' }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE }}
          build-args: GIT_SHA=${{ github.sha }}
      - name: vulnerability scan (report only)
        uses: aquasecurity/trivy-action@0.33.1
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  smoke:
    # Render deploys on push to main; smoke.py waits for readiness, then checks the live URL end to end.
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sleep 300 && python scripts/smoke.py "${{ vars.LIVE_URL || 'https://property-concierge.onrender.com' }}"
