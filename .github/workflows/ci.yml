name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-ingest.lock pytest ruff
      - run: ruff check src tests evals scripts && ruff format --check src tests evals scripts
      - run: pytest -q
        env: {PYTHONPATH: src}
      - name: prepare the int8 embedding model (same recipe as the image)
        run: python -c "from concierge.kb.embed import prepare_model; prepare_model()"
        env: {PYTHONPATH: src}
      - name: retrieval and router gates (uses the committed KB snapshot)
        run: python evals/run_eval.py
        env: {PYTHONPATH: src}

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

  smoke:
    # Render deploys on push to main; this waits for the new revision and checks the live URL.
    needs: image
    if: github.ref == 'refs/heads/main' && vars.LIVE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sleep 240 && python scripts/smoke.py "${{ vars.LIVE_URL }}"
