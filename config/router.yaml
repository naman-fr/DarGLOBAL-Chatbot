# Deterministic intent routing. Free models are not trusted with tool calling, so routing is rules.
injection_patterns:
  - "ignore (all|any|the|your)? ?(previous|prior|above) (instructions|prompts?|rules)"
  - "(reveal|show|print|repeat) (your|the) (system )?(prompt|instructions)"
  - "you are now|act as (?!a buyer)|pretend to be|developer mode|jailbreak|DAN\\b"
  - "تجاهل (كل )?التعليمات|اكشف (عن )?التعليمات|موجه النظام"
greeting_patterns:
  - "^(hi|hello|hey|good (morning|afternoon|evening)|salam|assalam[ou] ?alaikum)\\W*$"
  - "^(مرحبا|اهلا|أهلا|السلام عليكم|صباح الخير|مساء الخير)\\W*$"
handoff_patterns:
  - "\\b(talk|speak|chat) (to|with) (a |an )?(human|person|agent|someone|sales|advisor)"
  - "\\b(call me|contact me|reach me|book a (viewing|visit|call)|arrange a (viewing|visit)|register (my )?interest)\\b"
  - "(تواصل معي|اتصل بي|أريد التحدث|موظف مبيعات|حجز موعد|تسجيل اهتمام)"
